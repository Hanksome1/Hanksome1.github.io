polyline points="579.5,194.5 590.5,194.5" fill="none" stroke="#151513" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><polyline points="583,199 587,199" fill="none" stroke="#151513" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><text x="599" y="163.14" font-size="11.5" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" text-anchor="start" fill="#ff5418">Z/(1+A)</text><polyline points="730,120 730,142" fill="none" stroke="#151513" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="721" y="142" width="18" height="34" rx="0" fill="#ffffff" stroke="#2f6db5" stroke-width="1.5"/><polyline points="730,176 730,190" fill="none" stroke="#151513" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="721,190 739,190" fill="none" stroke="#151513" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polyline points="724.5,194.5 735.5,194.5" fill="none" stroke="#151513" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><polyline points="728,199 732,199" fill="none" stroke="#151513" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><text x="716" y="163.14" font-size="11.5" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" text-anchor="end" fill="#2f6db5">Z/(1+1/A)</text><text x="670" y="226.14" font-size="11.5" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" text-anchor="middle" fill="#4b4840">若 Z 是電容 C：</text><text x="670" y="246.14" font-size="11.5" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" text-anchor="middle" fill="#151513">C<tspan baseline-shift="sub" font-size="72%">in</tspan> = (1+A)C，C<tspan baseline-shift="sub" font-size="72%">out</tspan> = (1+1/A)C</text></svg>
