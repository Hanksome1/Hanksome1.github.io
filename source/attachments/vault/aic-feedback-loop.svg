oto Sans TC', sans-serif" text-anchor="end" fill="#888376">回授</text><text x="460" y="64.5" font-size="12.5" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" text-anchor="start" fill="#4b4840">closed-loop gain</text><text x="460" y="89.04" font-size="14" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" text-anchor="start" fill="#ff5418">y / x = A / (1 + AK)</text><text x="460" y="128.5" font-size="12.5" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" text-anchor="start" fill="#4b4840">loop gain</text><text x="460" y="152.68" font-size="13" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" text-anchor="start" fill="#151513">AK：沿著迴圈走一圈的增益</text><text x="460" y="188.68" font-size="13" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" text-anchor="start" fill="#151513">AK ≫ 1 時 y/x ≈ 1/K</text><text x="460" y="210.14" font-size="11.5" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang TC', 'Noto Sans TC', sans-serif" text-anchor="start" fill="#888376">只剩 K 決定增益，A 怎麼飄都沒差</text></svg>
