# ─────────────────────────────────────────────────────────────
#  tapeout theme — 你的個人設定
#  這個檔案會覆蓋 themes/tapeout/_config.yml 的預設值。
#  注意：陣列（nav、social、now、waveform.signals）不要同時寫在兩個檔案，否則會被合併。
# ─────────────────────────────────────────────────────────────

# 首頁有中英文兩版（/ 與 /en/）。要分語言的文字寫成 { zh-TW: …, en: … }，例如下面的 intro；
# 只寫一個字串就兩邊共用。profile 的文字欄位和 now 的 value 都可以這樣寫。
profile:
  name: Hank Wu                    # Hero 大標（建議英文名）
  name_zh: 吳承翰
  role: M.S. Student, Electrical Engineering
  affiliation: National Tsing Hua University
  focus: Digital IC Design · Computer Architecture · Computer Vision
  location: Hsinchu, Taiwan
  email: wu20040814@gmail.com
  # 一句話 tagline，*星號* 包起來的字會用斜體襯線字強調
  tagline: Designing *silicon* that thinks — one clock edge at a time.
  intro:
    zh-TW: 清大電機所碩士生，指導教授是黃朝宗老師。我喜歡把演算法一路搬上硬體：從 Python golden model、RTL 到後端流程；也做電腦視覺的演算法。這裡收錄我做過的專案與學習筆記。
    en: I'm an M.S. student in Electrical Engineering at NTHU, advised by Prof. Chao-Tsung Huang. I like taking an algorithm all the way down to hardware, from a Python golden model to RTL and through the back-end flow, and I also work on computer vision algorithms. This site collects the projects I've built and the notes I've taken along the way.
  # 右上角的狀態標籤，留空就不顯示
  status: ''

nav:
  - { label: Projects, path: /projects/ }
  - { label: Writing, path: /blog/ }
  - { label: Notes, path: /notes/ }
  - { label: About, path: /about/ }

